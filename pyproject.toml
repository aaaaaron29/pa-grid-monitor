[project]
name = "pjm-grid-watch"
version = "0.1.0"
description = "Near-real-time anomaly detection on the PJM grid, with a private PA-zone data-center correlation layer."
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.1",
    "requests>=2.31",
    "prometheus-client>=0.20",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "confluent-kafka>=2.3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "joblib>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "responses>=0.25",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable Postgres (TEST_DATABASE_URL); skipped if unset/unreachable",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "ingestion*", "model*", "inference*"]
