name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pjm_grid_watch
          POSTGRES_PASSWORD: pjm_grid_watch
          POSTGRES_DB: pjm_grid_watch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjm_grid_watch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI makes no live API calls (Architecture.md Section 7) — only the Postgres
      # integration tests use this; everything else runs against recorded fixtures.
      TEST_DATABASE_URL: postgresql://pjm_grid_watch:pjm_grid_watch@localhost:5432/pjm_grid_watch
      POSTGRES_DSN: postgresql://pjm_grid_watch:pjm_grid_watch@localhost:5432/pjm_grid_watch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Apply schema
        run: python scripts/apply_migrations.py

      - name: Pytest
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build (arm64 + amd64, no push)
        # Push lands once there's an actual image someone deploys (Phase 3+). For now this
        # just proves the Dockerfile builds clean for the Oracle Ampere A1 target on every push.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false
