name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pjm_grid_watch
          POSTGRES_PASSWORD: pjm_grid_watch
          POSTGRES_DB: pjm_grid_watch
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pjm_grid_watch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # CI makes no live API calls (Architecture.md Section 7) — only the Postgres
      # integration tests use this; everything else runs against recorded fixtures.
      TEST_DATABASE_URL: postgresql://pjm_grid_watch:pjm_grid_watch@localhost:5432/pjm_grid_watch
      POSTGRES_DSN: postgresql://pjm_grid_watch:pjm_grid_watch@localhost:5432/pjm_grid_watch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Apply schema
        run: python scripts/apply_migrations.py

      - name: Pytest
        run: pytest -v

  build-image:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build ingestion image (arm64 + amd64, no push)
        # Push lands once there's an actual image someone deploys (Phase 3+). For now this
        # just proves the Dockerfile builds clean for the Oracle Ampere A1 target on every push.
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64,linux/amd64
          push: false

      - name: Placeholder EIA artifact (build-only check, never run)
        # Dockerfile.inference-eia bakes artifacts/eia_detector.joblib in at build time. This
        # job only proves the Dockerfile's build mechanics work on both target platforms, it
        # never starts the container, so the file's content doesn't matter here -- a real
        # trained artifact is what scripts/train_detector_eia.py produces, and what
        # compose-smoke-test below actually loads and runs.
        run: mkdir -p artifacts && touch artifacts/eia_detector.joblib

      - name: Build EIA inference image (arm64 + amd64, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.inference-eia
          platforms: linux/arm64,linux/amd64
          push: false

      - name: Build PJM inference image (arm64 + amd64, no push)
        # No artifact placeholder needed -- this image never COPYs one in
        # (Architecture.md Section 7: mounted at runtime only).
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.inference-pjm
          platforms: linux/arm64,linux/amd64
          push: false

  compose-smoke-test:
    # Verifies docker-compose.yml itself: real build, real wiring (env overrides, depends_on
    # conditions, the PJM artifact volume mount), on a real Docker install. Brings up only
    # postgres/kafka/migrate/both inference services -- never the pollers, which would make
    # live EIA/PJM API calls (Architecture.md Section 7: CI makes no live API calls).
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Generate throwaway model artifacts
        # Real artifacts need real EIA/PJM data (scripts/train_detector_*.py), which CI
        # doesn't have. These are fit on synthetic data purely so both inference services
        # have something real to load and run against -- same construction
        # tests/test_score.py's _make_artifact() uses, not a real model.
        run: |
          python - <<'EOF'
          from datetime import UTC, datetime
          from pathlib import Path

          import numpy as np
          import pandas as pd

          from model.artifact import ModelArtifact
          from model.detector import Detector
          from model.features import build_features
          from model.flatline_detector import calibrate_floor

          def make_artifact(tier, zone, lag_periods, rolling_window, freq):
              rng = np.random.default_rng(0)
              n = lag_periods * 3
              idx = pd.date_range("2024-01-01", periods=n, freq=freq, tz="UTC")
              train = pd.Series(100.0 + rng.normal(0, 5, n), index=idx)
              forecast = train.shift(lag_periods)
              feats = build_features(
                  train, forecast, rate_of_change_lag_periods=1, rolling_window_periods=rolling_window
              ).dropna()
              detector = Detector().fit(feats)
              detector.calibrate_threshold(detector.score(feats), alert_budget=0.1)
              floor = calibrate_floor(feats["rolling_std"])
              return ModelArtifact(
                  tier=tier, zone=zone, detector=detector, flatline_floor=floor,
                  rolling_window_periods=rolling_window, rate_of_change_lag_periods=1,
                  seasonal_naive_lag_periods=lag_periods, trained_at=datetime.now(UTC),
                  train_rows=len(feats),
              )

          Path("artifacts").mkdir(exist_ok=True)
          make_artifact("eia", None, 24 * 7, 4, "h").save("artifacts/eia_detector.joblib")
          for zone in ["PECO", "PPL", "METED", "PENELEC", "DUQ"]:
              make_artifact("pjm", zone, 7 * 24 * 12, 12, "5min").save(
                  f"artifacts/pjm_detector_{zone}.joblib"
              )
          EOF

      - name: Minimal .env
        # docker-compose.yml's env_file: .env requires the file to exist; the EIA/PJM keys
        # are never used since the pollers aren't started here.
        run: |
          cat > .env <<'EOF'
          EIA_API_KEY=unused-in-ci
          PJM_API_KEY=unused-in-ci
          EOF

      - name: Bring up infra + both inference services + observability
        run: >
          docker compose up -d --build
          postgres kafka migrate eia-inference pjm-inference prometheus grafana

      - name: Wait for both inference services to report healthy
        run: |
          for i in $(seq 1 30); do
            eia=$(curl -fs http://localhost:8101/health || echo '{}')
            pjm=$(curl -fs http://localhost:8102/health || echo '{}')
            echo "attempt $i: eia=$eia pjm=$pjm"
            if echo "$eia" | grep -q '"model_loaded": *true' \
               && echo "$eia" | grep -q '"consumer_alive": *true' \
               && echo "$pjm" | grep -q '"model_loaded": *true' \
               && echo "$pjm" | grep -q '"consumer_alive": *true'; then
              echo "Both inference services up, model loaded, consumer attached."
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for inference services to report healthy."
          exit 1

      - name: Wait for Prometheus and check it's actually scraping
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:9090/-/ready >/dev/null; then break; fi
            sleep 3
          done
          curl -fs http://localhost:9090/-/ready

          # Prometheus being ready (its own HTTP API working) is independent of whether it
          # has actually completed a scrape cycle yet (15s scrape_interval) -- checking
          # target health only once right after /-/ready is a timing race, not a real
          # check. Confirmed live in CI (2026-10-14): both targets briefly showed down
          # (one a DNS blip, one "connection refused") purely because this ran before the
          # first scrape cycle completed. Retry the actual target health, not just
          # Prometheus's own readiness.
          for i in $(seq 1 20); do
            targets=$(curl -fs 'http://localhost:9090/api/v1/targets')
            all_up=true
            for job in eia-inference pjm-inference; do
              up=$(echo "$targets" | python -c "
          import json, sys
          data = json.load(sys.stdin)
          matches = [t for t in data['data']['activeTargets'] if t['labels']['job'] == '$job']
          print(matches[0]['health'] if matches else 'missing')
          ")
              echo "attempt $i: $job -> $up"
              [ "$up" = "up" ] || all_up=false
            done
            if [ "$all_up" = "true" ]; then
              echo "Both eia-inference and pjm-inference targets are up."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for Prometheus targets to report up."
          echo "$targets"
          exit 1

      - name: Wait for Grafana and check both dashboards were provisioned
        run: |
          for i in $(seq 1 20); do
            if curl -fs http://localhost:3000/api/health >/dev/null; then break; fi
            sleep 3
          done
          curl -fs http://localhost:3000/api/health

          # Dashboard and datasource provisioning are both async, file-based steps that can
          # finish slightly after Grafana's HTTP server itself starts responding to
          # /api/health -- same class of race as the Prometheus scrape-cycle fix above.
          # Confirmed live in CI (2026-10-14): both dashboards provisioned fine (visible in
          # the search output) but the Postgres datasource lookup right after failed with no
          # diagnostic output at all, consistent with set -e killing the script on a curl
          # that ran before provisioning had actually finished. Retry each stage instead of
          # checking once right after /api/health responds.
          for i in $(seq 1 20); do
            dashboards=$(curl -fs -u admin:pjm_grid_watch 'http://localhost:3000/api/search?type=dash-db' || echo '[]')
            if echo "$dashboards" | grep -q '"pjm-grid-watch-public-eia"' \
               && echo "$dashboards" | grep -q '"pjm-grid-watch-private-pjm"'; then
              echo "Both dashboards provisioned."
              break
            fi
            echo "attempt $i: dashboards not provisioned yet -- $dashboards"
            sleep 3
            [ "$i" = "20" ] && { echo "Timed out waiting for both dashboards."; exit 1; }
          done

          for i in $(seq 1 20); do
            ds=$(curl -fs -u admin:pjm_grid_watch 'http://localhost:3000/api/datasources/name/Postgres' || echo '{}')
            ds_id=$(echo "$ds" | python -c "import json,sys; print(json.load(sys.stdin).get('id',''))")
            if [ -n "$ds_id" ]; then
              echo "Postgres datasource found, id=$ds_id"
              break
            fi
            echo "attempt $i: Postgres datasource not registered yet -- $ds"
            sleep 3
            [ "$i" = "20" ] && { echo "Timed out waiting for the Postgres datasource."; exit 1; }
          done

          # The Postgres datasource is what every panel in both dashboards actually queries;
          # confirm Grafana can reach it, not just that it was registered. The health
          # endpoint is UID-based, not ID-based (confirmed against Grafana's own API docs
          # after getting a silent {} failure in CI, 2026-10-14, from using the ID-based
          # path) -- infra/grafana/provisioning/datasources/datasources.yml sets this
          # datasource's uid explicitly to "postgres", so no lookup is needed for it.
          for i in $(seq 1 20); do
            health=$(curl -fs -u admin:pjm_grid_watch "http://localhost:3000/api/datasources/uid/postgres/health" || echo '{}')
            echo "attempt $i: datasource health -> $health"
            if echo "$health" | grep -q '"status":"OK"'; then
              echo "Postgres datasource is healthy."
              exit 0
            fi
            sleep 3
          done
          echo "Timed out waiting for the Postgres datasource to report healthy."
          exit 1

      - name: Logs (on failure)
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
