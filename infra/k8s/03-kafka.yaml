# Single-broker KRaft mode (no Zookeeper), same as docker-compose.yml and the original
# no-Docker local setup -- Architecture.md's 2 OCPU/12GB Oracle VM budget has no room for a
# real multi-broker cluster, and this project doesn't need one.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: pjm-grid-watch
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: CLUSTER_ID, value: "MkU3OEVBNTcwNTJENDM2Qk" }
          volumeMounts:
            - name: kafka-data
              mountPath: /var/lib/kafka/data
          # TCP probes, not kafka-broker-api-versions.sh. That script starts a JVM every time
          # and takes longer than a probe's default 1 second timeout, so on a small node it
          # always timed out: the pod never became Ready, the headless Service never resolved
          # `kafka`, and the liveness probe kept killing a healthy broker. Found by the CI
          # replay test, the first thing to need Kafka reachable in the cluster. The startup
          # probe gives a slow first boot up to 150 seconds before the others take over.
          startupProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 20
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: kafka-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: pjm-grid-watch
spec:
  clusterIP: None
  # The broker has to resolve its own name (`kafka`, its advertised address and its controller
  # quorum voter) before it can start, and it only becomes Ready once it has. A headless
  # Service normally publishes DNS only for Ready pods, which makes that a deadlock: the
  # broker dies with UnknownHostException on kafka:9093 and never gets there.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
