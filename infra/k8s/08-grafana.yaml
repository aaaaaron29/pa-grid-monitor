# Generated from infra/grafana/provisioning/ -- do not hand-edit the embedded content
# here, edit the source files there and regenerate (see infra/k8s/README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: pjm-grid-watch
data:
  datasources.yml: |
    # Provisioned once at container start (Grafana's file-based provisioning, not clicked
    # through the UI, same infra-as-code approach as infra/sql's migrations). Two datasources:
    # Prometheus for pipeline-health panels (staleness, scoring latency, error rates) and
    # Postgres for the actual grid-data panels (demand, LMP, residuals, anomaly log) -- the
    # public dashboard's panel sketch (Architecture.md Section 5) needs real readings and
    # anomaly rows, which live in Postgres, not Prometheus.
    apiVersion: 1

    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: false

      - name: Postgres
        uid: postgres
        type: postgres
        access: proxy
        url: postgres:5432
        database: pjm_grid_watch
        user: pjm_grid_watch
        secureJsonData:
          password: pjm_grid_watch
        jsonData:
          sslmode: disable
          postgresVersion: 1600
          timescaledb: false
---
# dashboards.yml, public_eia.json, and private_pjm.json all live in one ConfigMap mounted
# at one path, mirroring the fix for the exact same issue hit with Docker Compose
# (infra/grafana/provisioning/dashboards/dashboards.yml has the full story): the provider
# config's own `path` points at wherever it itself lives, so the dashboard JSON files have
# to be mounted alongside it, not in a separate ConfigMap at a different path -- splitting
# them would mean Grafana's provider never finds the dashboards at all.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: pjm-grid-watch
data:
  dashboards.yml: |
    # Points Grafana at the JSON dashboard files sitting right alongside this one, loaded once
    # at container start. Editing a dashboard in the UI and wanting to keep it means exporting
    # its JSON back to this directory -- these files are the source of truth, not what's in a
    # running Grafana's database.
    #
    # Deliberately in the same directory as this file, not a nested subfolder: docker-compose.yml
    # mounts the whole infra/grafana/provisioning tree as one read-only bind mount, and Docker
    # cannot create a second mount point inside an already-mounted read-only directory (hit this
    # for real in CI, 2026-10-14 -- a separate ./infra/grafana/dashboards mount nested under this
    # one failed with "read-only file system" at container start).
    apiVersion: 1

    providers:
      - name: pjm-grid-watch
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards
  public_eia.json: |
    {
      "title": "PJM Grid Watch: Public (EIA)",
      "uid": "pjm-grid-watch-public-eia",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "America/New_York",
      "time": {
        "from": "now-7d",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "pjm-grid-watch",
        "public"
      ],
      "annotations": {
        "list": [
          {
            "name": "Flagged anomalies",
            "enable": true,
            "iconColor": "red",
            "datasource": {
              "type": "postgres",
              "uid": "postgres"
            },
            "target": {
              "rawSql": "SELECT period_start AS time, 'anomaly' AS text, CASE WHEN forest_flagged THEN 'forest' ELSE 'flatline' END AS tags FROM eia_anomalies WHERE reading_type='D' AND (forest_flagged OR flatline_flagged) AND $__timeFilter(period_start)",
              "format": "table",
              "editorMode": "code",
              "rawQuery": true
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Current PJM demand",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT value_mw * 1000000 AS value FROM eia_readings WHERE respondent='PJM' AND reading_type='D' AND quality != 'missing' ORDER BY period_start DESC LIMIT 1",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "24h peak demand",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT max(value_mw) * 1000000 AS value FROM eia_readings WHERE respondent='PJM' AND reading_type='D' AND period_start > now() - interval '24 hours'",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Data freshness",
          "description": "Time since the most recent EIA demand reading. EIA-930 is hourly, so a healthy value here is well under 2 hours.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT extract(epoch from (now() - max(period_start))) AS value FROM eia_readings WHERE respondent='PJM' AND reading_type='D'",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Anomalies flagged (7d)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT count(*) AS value FROM eia_anomalies WHERE reading_type='D' AND (forest_flagged OR flatline_flagged) AND scored_at > now() - interval '7 days'",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Demand vs forecast",
          "description": "The project's single money panel. Forecast is the seasonal-naive baseline the detector actually scores against (model/baselines.py), derived here as actual - residual, not a separately stored column. Flagged intervals are marked as annotations.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT r.period_start AS time, r.value_mw * 1000000 AS actual, (r.value_mw - a.residual) * 1000000 AS forecast FROM eia_readings r LEFT JOIN eia_anomalies a ON a.period_start = r.period_start AND a.reading_type = r.reading_type WHERE r.respondent='PJM' AND r.reading_type='D' AND $__timeFilter(r.period_start) ORDER BY r.period_start",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Forecast residuals",
          "description": "The series the isolation forest actually scores. Flagged points (forest-flagged) are shown as a separate overlaid series so you can see why something was flagged, not just that it was.",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "flagged"
                },
                "properties": [
                  {
                    "id": "custom.drawStyle",
                    "value": "points"
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT period_start AS time, residual * 1000000 AS residual, CASE WHEN forest_flagged THEN residual * 1000000 ELSE NULL END AS flagged FROM eia_anomalies WHERE reading_type='D' AND $__timeFilter(period_start) ORDER BY period_start",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 7,
          "type": "table",
          "title": "Anomaly log",
          "gridPos": {
            "x": 0,
            "y": 21,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT period_start AS \"Time\", residual * 1000000 AS \"Residual (W)\", forest_score AS \"Forest score\", forest_flagged AS \"Forest flagged\", flatline_flagged AS \"Flatline flagged\", scored_at AS \"Scored at\" FROM eia_anomalies WHERE reading_type='D' AND (forest_flagged OR flatline_flagged) AND $__timeFilter(period_start) ORDER BY period_start DESC LIMIT 100",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Net generation and total interchange",
          "description": "Context, not detection. EIA-930 reports a single aggregate net-generation figure, not a fuel-type breakdown, so this is not a generation mix panel.",
          "gridPos": {
            "x": 0,
            "y": 29,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "watt"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT period_start AS time, value_mw * 1000000 AS net_generation FROM eia_readings WHERE respondent='PJM' AND reading_type='NG' AND $__timeFilter(period_start) ORDER BY period_start",
              "editorMode": "code",
              "rawQuery": true
            },
            {
              "refId": "B",
              "format": "time_series",
              "rawSql": "SELECT period_start AS time, value_mw * 1000000 AS total_interchange FROM eia_readings WHERE respondent='PJM' AND reading_type='TI' AND $__timeFilter(period_start) ORDER BY period_start",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 9,
          "type": "text",
          "title": "Methodology",
          "gridPos": {
            "x": 0,
            "y": 37,
            "w": 24,
            "h": 6
          },
          "options": {
            "mode": "markdown",
            "content": "**How this detector works.** An isolation forest scores the residual (actual minus a seasonal-naive forecast) plus rolling context features, fit only on data through mid-2025 and calibrated on a later validation window it never trained on, same time-based split used throughout this project to avoid lookahead leakage. A separate rule-based check independently flags sustained flatlines (a failure mode an anomaly-on-residual model alone does not reliably catch). **There are no real anomaly labels for this data.** Detector quality is instead measured by injecting synthetic anomalies (spikes, step changes, flatlines, abnormal ramps) into held-out data and measuring recall at a fixed false-positive budget, a check on the method, not a guarantee about real events. See the project's ARCHITECTURE.md for the full methodology and the real recall numbers this was measured at."
          }
        }
      ]
    }
  private_pjm.json: |
    {
      "title": "PJM Grid Watch: Private (PJM zones)",
      "uid": "pjm-grid-watch-private-pjm",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "timezone": "America/New_York",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "refresh": "1m",
      "tags": [
        "pjm-grid-watch",
        "private"
      ],
      "templating": {
        "list": [
          {
            "name": "zone",
            "type": "custom",
            "query": "PECO,PPL,METED,PENELEC,DUQ",
            "current": {
              "text": "PECO",
              "value": "PECO"
            },
            "includeAll": false,
            "multi": false
          }
        ]
      },
      "annotations": {
        "list": [
          {
            "name": "Flagged anomalies",
            "enable": true,
            "iconColor": "red",
            "datasource": {
              "type": "postgres",
              "uid": "postgres"
            },
            "target": {
              "rawSql": "SELECT period_start AS time, 'anomaly' AS text, CASE WHEN forest_flagged THEN 'forest' ELSE 'flatline' END AS tags FROM pjm_lmp_anomalies WHERE zone='$zone' AND (forest_flagged OR flatline_flagged) AND $__timeFilter(period_start)",
              "format": "table",
              "editorMode": "code",
              "rawQuery": true
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Current LMP ($zone)",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT lmp_price AS value FROM pjm_lmp_readings WHERE zone='$zone' AND quality != 'missing' ORDER BY period_start DESC LIMIT 1",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "24h peak LMP ($zone)",
          "gridPos": {
            "x": 6,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD",
              "decimals": 2
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT max(lmp_price) AS value FROM pjm_lmp_readings WHERE zone='$zone' AND period_start > now() - interval '24 hours'",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Data freshness ($zone)",
          "description": "Time since the most recent LMP reading for this zone. The live feed posts every 5 minutes, so a healthy value here is well under 10 minutes.",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT extract(epoch from (now() - max(period_start))) AS value FROM pjm_lmp_readings WHERE zone='$zone'",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Anomalies flagged, this zone (7d)",
          "gridPos": {
            "x": 18,
            "y": 0,
            "w": 6,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT count(*) AS value FROM pjm_lmp_anomalies WHERE zone='$zone' AND (forest_flagged OR flatline_flagged) AND scored_at > now() - interval '7 days'",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 5,
          "type": "stat",
          "title": "All 5 zones, anomalies flagged (7d)",
          "description": "Cross-zone view, independent of the $zone selector above, so a stress event isolated to one zone is still visible from this panel.",
          "gridPos": {
            "x": 0,
            "y": 4,
            "w": 24,
            "h": 4
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT zone AS \"Zone\", count(*) AS \"Anomalies (7d)\" FROM pjm_lmp_anomalies WHERE (forest_flagged OR flatline_flagged) AND scored_at > now() - interval '7 days' GROUP BY zone ORDER BY zone",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "LMP vs forecast ($zone)",
          "description": "Forecast is the seasonal-naive baseline the detector scores against (7-day lag at 5-minute grain), derived as actual - residual, not a separately stored column.",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 24,
            "h": 9
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT r.period_start AS time, r.lmp_price AS actual, (r.lmp_price - a.residual) AS forecast FROM pjm_lmp_readings r LEFT JOIN pjm_lmp_anomalies a ON a.period_start = r.period_start AND a.zone = r.zone WHERE r.zone='$zone' AND $__timeFilter(r.period_start) ORDER BY r.period_start",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Forecast residuals ($zone)",
          "description": "The series the isolation forest actually scores. Flagged points are overlaid separately so you can see why something was flagged.",
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "currencyUSD"
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "flagged"
                },
                "properties": [
                  {
                    "id": "custom.drawStyle",
                    "value": "points"
                  }
                ]
              }
            ]
          },
          "targets": [
            {
              "refId": "A",
              "format": "time_series",
              "rawSql": "SELECT period_start AS time, residual, CASE WHEN forest_flagged THEN residual ELSE NULL END AS flagged FROM pjm_lmp_anomalies WHERE zone='$zone' AND $__timeFilter(period_start) ORDER BY period_start",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 8,
          "type": "table",
          "title": "Anomaly log ($zone)",
          "gridPos": {
            "x": 0,
            "y": 25,
            "w": 24,
            "h": 8
          },
          "datasource": {
            "type": "postgres",
            "uid": "postgres"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "rawSql": "SELECT period_start AS \"Time\", residual AS \"Residual ($/MWh)\", forest_score AS \"Forest score\", forest_flagged AS \"Forest flagged\", flatline_flagged AS \"Flatline flagged\", scored_at AS \"Scored at\" FROM pjm_lmp_anomalies WHERE zone='$zone' AND (forest_flagged OR flatline_flagged) AND $__timeFilter(period_start) ORDER BY period_start DESC LIMIT 100",
              "editorMode": "code",
              "rawQuery": true
            }
          ]
        },
        {
          "id": 9,
          "type": "text",
          "title": "Methodology and scope",
          "gridPos": {
            "x": 0,
            "y": 33,
            "w": 24,
            "h": 7
          },
          "options": {
            "mode": "markdown",
            "content": "**How this detector works.** Same method as the public dashboard: an isolation forest on forecast residuals plus rolling context, fit per zone on a time-based train/validation split, with a separate rule-based flatline check running alongside it. No real anomaly labels exist for this data; detector quality is measured via synthetic-anomaly injection on held-out data, a check on the method, not a guarantee about real events. **Data-center interconnection correlation is not shown here.** It was planned as a core feature but is confirmed deferred (ARCHITECTURE.md Section 3): PJM's Large Load Registry took effect 2026-10-12 and public access, once defined, will be aggregated-only; PJM's own compliance filing describing the actual access mechanism is not due until around 2026-11-08. There is nothing to correlate against yet. This dashboard and its underlying data are PJM Data Miner 2 sourced and are never exposed on the public dashboard or any externally shared link, per PJM's non-member redistribution terms."
          }
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: pjm-grid-watch
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:13.0.2
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: pjm-grid-watch-secrets, key: GRAFANA_ADMIN_PASSWORD } }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboards, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: grafana-data, mountPath: /var/lib/grafana }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: datasources
          configMap: { name: grafana-datasources }
        - name: dashboards
          configMap: { name: grafana-dashboards }
        - name: grafana-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: pjm-grid-watch }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
