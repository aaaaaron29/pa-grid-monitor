# Identical scrape config to infra/prometheus/prometheus.yml -- see that file's comment for
# why this reuses static targets instead of Kubernetes API-based service discovery. Kept as
# a separate copy, not a shared mount, since infra/k8s/ is plain manifests on purpose
# (Architecture.md Section 8: "plain manifests ... for every service", not a templating
# layer that would let the two stay in sync automatically).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pjm-grid-watch
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: eia-poller
        static_configs: [{ targets: ["eia-poller:9100"] }]
      - job_name: eia-consumer
        static_configs: [{ targets: ["eia-consumer:9100"] }]
      - job_name: pjm-poller
        static_configs: [{ targets: ["pjm-poller:9100"] }]
      - job_name: pjm-consumer
        static_configs: [{ targets: ["pjm-consumer:9100"] }]
      - job_name: eia-inference
        static_configs: [{ targets: ["eia-inference:9100"] }]
      - job_name: pjm-inference
        static_configs: [{ targets: ["pjm-inference:9100"] }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pjm-grid-watch
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args: ["--config.file=/etc/prometheus/prometheus.yml"]
          ports: [{ containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: pjm-grid-watch }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
