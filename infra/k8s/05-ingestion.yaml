# Three consumer Deployments, sharing the same ingestion image as the pollers (see
# 11-ingestion-pollers.yaml) but differing in their startup module and, more importantly,
# in what they're safe to run where: these only read from Kafka and write to Postgres, they
# never call EIA/PJM's real APIs, so unlike the pollers they're harmless to run anywhere,
# including CI (sitting idle with no messages to consume is a no-op, not a live call).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eia-consumer
  namespace: pjm-grid-watch
spec:
  replicas: 1
  selector: { matchLabels: { app: eia-consumer } }
  template:
    metadata: { labels: { app: eia-consumer } }
    spec:
      imagePullSecrets: [{ name: ghcr-pull-secret }]
      containers:
        - name: eia-consumer
          image: ghcr.io/aaaaaron29/pa-grid-monitor-ingestion:latest
          args: ["ingestion.eia_poller.consumer"]
          envFrom:
            - configMapRef: { name: pjm-grid-watch-config }
            - secretRef: { name: pjm-grid-watch-secrets }
          ports: [{ containerPort: 9100, name: metrics }]
---
apiVersion: v1
kind: Service
metadata: { name: eia-consumer, namespace: pjm-grid-watch }
spec:
  selector: { app: eia-consumer }
  ports: [{ port: 9100, targetPort: 9100 }]
---
