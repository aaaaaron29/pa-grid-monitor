# Placeholder values only, safe to commit -- matches CI's "unused-in-ci" API keys
# (.github/workflows/ci.yml) and the same Postgres credentials docker-compose.yml already
# uses for local dev, same reasoning: convenient out-of-the-box `kubectl apply -f
# infra/k8s/` for local kind/k3d testing, never real secrets.
#
# For the real Oracle VM deploy (Architecture.md Section 9 Phase 5), override every value
# here with `kubectl create secret generic ... --dry-run=client -o yaml | kubectl apply -f -`
# or an external-secrets/sealed-secrets setup, not by editing this file with real values and
# committing it -- the whole point of a Secret is that its real contents never go in git.
apiVersion: v1
kind: Secret
metadata:
  name: pjm-grid-watch-secrets
  namespace: pjm-grid-watch
type: Opaque
stringData:
  POSTGRES_USER: pjm_grid_watch
  POSTGRES_PASSWORD: pjm_grid_watch
  POSTGRES_DB: pjm_grid_watch
  # Embeds the same password as POSTGRES_PASSWORD above -- common/config.py's Settings only
  # reads one POSTGRES_DSN env var, not separate host/user/password fields, so the full
  # connection string (password included) has to live here, not in the ConfigMap below.
  POSTGRES_DSN: postgresql://pjm_grid_watch:pjm_grid_watch@postgres:5432/pjm_grid_watch
  EIA_API_KEY: unused-placeholder
  PJM_API_KEY: unused-placeholder
  GRAFANA_ADMIN_PASSWORD: pjm_grid_watch
---
# Placeholder image-pull credentials for ghcr.io. Architecture.md Section 7: the private
# (PJM) tier's image goes to a *private* GHCR package deliberately, since it carries
# PJM-derived material -- so pulling it needs real authentication regardless of CI, this
# isn't just a CI convenience. Real use replaces this the same way as the Secret above:
#   kubectl create secret docker-registry ghcr-pull-secret -n pjm-grid-watch \
#     --docker-server=ghcr.io --docker-username=<user> --docker-password=<a real PAT or
#     GITHUB_TOKEN with read:packages> --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull-secret
  namespace: pjm-grid-watch
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"ghcr.io":{"username":"placeholder","password":"placeholder","auth":"cGxhY2Vob2xkZXI6cGxhY2Vob2xkZXI="}}}
---
# Non-secret shared config. Separate from the Secret above so `kubectl diff`/review on this
# one is readable without a plaintext dump of credentials sitting next to it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pjm-grid-watch-config
  namespace: pjm-grid-watch
data:
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  EIA_POLL_INTERVAL_SECONDS: "3600"
  EIA_ROLLING_WINDOW_HOURS: "72"
  EIA_BACKFILL_PAGE_SIZE: "5000"
  PJM_POLL_INTERVAL_SECONDS: "300"
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  METRICS_PORT: "9100"
