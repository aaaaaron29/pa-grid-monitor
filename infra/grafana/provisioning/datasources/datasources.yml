# Provisioned once at container start (Grafana's file-based provisioning, not clicked
# through the UI, same infra-as-code approach as infra/sql's migrations). Two datasources:
# Prometheus for pipeline-health panels (staleness, scoring latency, error rates) and
# Postgres for the actual grid-data panels (demand, LMP, residuals, anomaly log) -- the
# public dashboard's panel sketch (Architecture.md Section 5) needs real readings and
# anomaly rows, which live in Postgres, not Prometheus.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false

  - name: Postgres
    uid: postgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: pjm_grid_watch
    secureJsonData:
      password: pjm_grid_watch
    jsonData:
      # database belongs here, not as a top-level field -- confirmed live (2026-10-14):
      # a top-level `database` field was silently accepted by the datasource health check
      # and by direct backend query API calls, but Grafana's frontend query editor
      # (SqlDatasource.ts) checks jsonData.database specifically before sending any query
      # at all, failing client-side with "no default database configured" and never
      # issuing a request -- which is why every panel showed "No data" with nothing even
      # appearing in the browser's network tab.
      database: pjm_grid_watch
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
